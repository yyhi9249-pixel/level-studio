<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Level Studio - free GRAB level builder</title>
<link rel="stylesheet" href="style.css?v=10">
<script type="importmap">
{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"}}
</script>
</head>
<body>

<section id="home">
  <div class="app">
    <aside class="nav">
      <div class="brand">Level Studio<small id="ver"></small></div>
      <div id="folders"></div>
      <button id="newFolder">+ New folder</button>
      <span class="spacer"></span>
      <button id="joinBtn">Join a room</button>
      <button id="helpBtn">Help</button>
      <button id="updBtn">Updates and limitations</button>
      <button id="fbBtn">Send feedback</button>
      <button id="setBtn">Settings</button>
    </aside>
    <main class="hmain">
      <div class="bar">
        <input id="search" placeholder="Search projects">
        <input id="newName" placeholder="Level name" maxlength="40">
        <button id="createBtn" class="primary">New project</button>
        <button data-act="level">Import .level</button>
        <button data-act="tex">Import textures</button>
      </div>
      <ul id="projectList"></ul>
      <div id="hsettings" hidden>
        <h3>Appearance</h3>
        <button id="themeBtn">Light / dark</button>
        <p class="note">Projects are saved in this browser. Editor options are in the Settings menu inside the editor.</p>
      </div>
    </main>
  </div>
</section>

<section id="editor" hidden>
  <header>
    <nav id="menus"></nav>
    <button id="homeBtn" title="Back to projects">Projects</button>
    <strong id="projName"></strong>
    <span id="status"></span>
    <span class="spacer"></span>
    <button id="exportBtn" class="primary" title="Ctrl+E">Export .level</button>
  </header>

  <aside id="left">
    <h3>Shapes</h3>
    <div id="shapes" class="grid"></div>
    <h3>Special</h3>
    <div id="specials" class="grid"></div>
    <h3>Textures</h3>
    <div id="mats" class="grid"></div>
  </aside>

  <main id="view">
    <div id="toolbar">
      <button data-tool="select" title="Select (Q)">Select</button>
      <span class="sep"></span>
      <button data-mode="translate" title="Move (W)">Move</button>
      <button data-mode="rotate" title="Rotate (E)">Rotate</button>
      <button data-mode="scale" title="Scale (R)">Scale</button>
      <span class="sep"></span>
      <button data-tool="place" title="Place (B)">Place</button>
      <button id="atmoBtn" title="Atmosphere (A)">Atmosphere</button>
      <label class="snap" title="Toggle with G"><input type="checkbox" id="snap" checked> Snap</label>
      <input id="snapAmt" type="number" value="0.25" step="0.05" min="0.05" title="Snap amount" style="width:58px">
    </div>
    <div id="banner" hidden></div>
    <div id="atmo" class="float" hidden><h3>Atmosphere <button id="atmoX" title="Close">x</button></h3><div id="atmoBody"></div></div>
  </main>

  <aside id="right">
    <section>
      <h3>Outliner <span id="ocount" class="badge"></span></h3>
      <div id="outliner"></div>
    </section>
    <section>
      <h3 id="selTitle">Inspector</h3>
      <div class="xf">
        <h4 id="xfTitle">New block size</h4>
        <div class="vrow"><b>Pos</b><input id="px" type="number" step="0.25"><input id="py" type="number" step="0.25"><input id="pz" type="number" step="0.25"></div>
        <div class="vrow"><b>Rot</b><input id="rx" type="number" step="15"><input id="ry" type="number" step="15"><input id="rz" type="number" step="15"></div>
        <div class="vrow"><b>Size</b><input id="sx" type="number" value="1" min="0.25" step="0.25"><input id="sy" type="number" value="1" min="0.25" step="0.25"><input id="sz" type="number" value="1" min="0.25" step="0.25"></div>
      </div>
      <div id="props"></div>
    </section>
  </aside>

  <footer id="statusbar">
    <span id="sbTool"></span><span id="sbSel"></span>
    <span class="spacer"></span>
    <span id="sbCount"></span><span>Press ? for shortcuts</span>
  </footer>
</section>

<dialog id="dlg">
  <h3 id="dlgT"></h3>
  <pre id="dlgB"></pre>
  <div class="row"><button id="dlgCopy">Copy</button><button id="dlgClose" class="primary">Close</button></div>
</dialog>

<input type="file" id="fileLevel" accept=".level" hidden>
<input type="file" id="fileTex" webkitdirectory multiple hidden>
<script src="https://cdn.jsdelivr.net/npm/protobufjs@7.2.5/dist/protobuf.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/peerjs@1.5.4/dist/peerjs.min.js"></script>
<script type="module" src="editor.js?v=10"></script>
</body>
</html>
